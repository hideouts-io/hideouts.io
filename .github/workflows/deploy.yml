name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly build validation against project READMEs (06:17 UTC).
    - cron: '17 6 * * *'
  repository_dispatch:
    # Fire from a project repo to validate its README change:
    #   gh api repos/hideouts-io/hideouts.io/dispatches -f event_type=content-update
    types: [content-update]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint, formatting, and type checks
        run: |
          npm run lint
          npm run format:check
          npm run typecheck

      # The last good GitHub snapshot. If the API is down or rate-limited, the
      # fetch step keeps these copies instead of failing the build.
      - name: Restore content cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/github
          key: github-content-${{ github.run_id }}
          restore-keys: github-content-

      - name: Fetch and render content from the allowlisted repositories
        run: npm run content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build site and search index
        run: npm run build
        env:
          # The commit shown in the footer and on /colophon/. On pull requests,
          # the PR head rather than GitHub's temporary merge commit.
          SITE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Allowlist and internal link checks
        run: npm run verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: External link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        # Blocking on pushes and pull requests; advisory on scheduled and
        # dispatched runs so a flaky third-party link can't stop a content sync.
        # 429 and 503 are accepted: GitHub throttles bursts of requests from
        # Actions runners to its file pages, which says nothing about whether a
        # link is dead (404/410 still fail).
        continue-on-error: ${{ github.event_name == 'schedule' || github.event_name == 'repository_dispatch' }}
        with:
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/dist
            --max-retries 3
            --retry-wait-time 5
            --max-concurrency 8
            --accept 200,206,429,503
            --exclude '^https://hideouts\.io'
            --exclude-path dist/pagefind
            'dist/**/*.html'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
          # Needed for /.well-known/security.txt; the action skips dot-folders by default.
          include-hidden-files: true

  deploy:
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
